version: "3.8"

x-airflow-common: &airflow-common
  build: . # Use the Dockerfile in the current directory
  #image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    #AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    #ALERT_EMAILS: your.email@domain.com
    # I added all 4 below
    ALERT_EMAILS: zhengkaiqiang1998@gmail.com
    PYTHONPATH: /opt/airflow # Add this line to include /opt/airflow in PYTHONPATH
    #_PIP_ADDITIONAL_REQUIREMENTS: "pyspark==3.5.0" # Add PySpark installation (added in dockerfile instead)
    AIRFLOW__WEBSERVER__SECRET_KEY: 'something_very_long_and_secret_and_can_be_anything' # help us to see the logs in webserver so scheduler can write logs to webserver
    SPARK_MASTER: "spark://spark-master:7077" # We need to set this so that Airflow can connect to Spark Master
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: 300 # After changing spark 3.5.3 Increase webserver timeout to handle long operations
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ----------------------------
  # Postgres (Airflow Metadata)
  # ----------------------------
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  # ----------------------------
  # Airflow Webserver
  # ----------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always

  # ----------------------------
  # Airflow Scheduler
  # ----------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: always

  # ----------------------------
  # Spark Master
  # ----------------------------
  spark-master:
    image: bitnamilegacy/spark:3.5.3
    container_name: spark-master
   #user: root
    user: "50000:0" # To match airflow user UID 50000 so they can share volumes, no authority issues. Bitnami spark image default user is 1001 
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./data:/opt/data
    restart: always

  # ----------------------------
  # Spark Worker
  # ----------------------------
  spark-worker:
    image: bitnamilegacy/spark:3.5.3
    container_name: spark-worker
   #user: root
    user: "50000:0"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./data:/opt/data
    restart: always

volumes:
  postgres-db-volume:
