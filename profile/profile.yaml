# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed a Linux cluster monitoring system for Jarvis' LCA team using Docker-contained PostgreSQL to store node performance data. Implemented Bash scripts to automate container lifecycle, database table creation, and data insertion from Linux hardware metrics. Scheduled one-minute interval data collection via crontab and conducted manual testing on GCP virtual machines running Rocky Linux 9. Leveraged Git for version control, centralizing monitoring and reducing manual overhead, enabling administrators to efficiently track system performance and resource usage across multiple clusters.
  - name: "Core Java Apps"
    git_url: "/core_java"
    description:
#      - "Twitter App: Curabitur laoreet tristique leo, eget suscipit nisi. Sed in sodales ex. Maecenas vitae tincidunt dui, et eleifend quam."
      - "JDBC App: Developed a stock quote management application that allows users to track their investments, buy, and sell stocks. The application integrates a real-time stock data REST API and stores stock information in a PostgreSQL database via JDBC. A command-line interface (CLI) was created for users to simulate transactions and monitor the performance of their portfolio. Additionally, SLF4J logging was implemented to capture and log any errors that occur during application execution. The project leveraged Maven for efficient dependency management, Docker for containerization and deployment, and was thoroughly tested with JUnit and Mockito to ensure reliability and high code quality throughout the development process."
      - "Grep App: Developed a Java-based application leveraging object-oriented programming principles, designed to function similarly to the Linux grep command. The tool recursively traverses user-specified directories, identifies matches based on user-provided regex patterns, and stores the results in an output file. Java Streams and Lambda expressions were utilized to enhance performance, while Logback was employed for efficient logging. The application was manually tested and debugged using IntelliJ IDEA to ensure reliability. For deployment, a Docker image was created via a custom Dockerfile, with Maven handling dependency management and Git used for version control."
#  - name: "Springboot App"
#    git_url: "/springboot"
#    description: ""
  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    description: "Delivered data-driven insights for London Gift Shop (LGS), a London-based online retailer, by transforming historical sales data into actionable recommendations. Built a PostgreSQL data warehouse and performed analysis in Python (NumPy, Pandas, Matplotlib) via Jupyter Notebook. Key tasks included tracking monthly sales and customer growth, and applying RFM (Recency, Frequency, Monetary) segmentation to support targeted marketing. Ensured reproducibility through Docker containerization and maintained workflow with Git version control."
#  - name: "Hadoop"
#    git_url: "/hadoop"
#    description: ""
  - name: "Spark"
    git_url: "/spark"
    description: "Built a distributed data analytics pipeline using Apache Spark (PySpark) to efficiently process large customer transaction datasets for a marketing team. Assessed and compared Zeppelin (Hadoop-based) and Databricks (AWS-based) Spark environments to evaluate scalability and processing efficiency. Utilized Delta Lake on Databricks and HDFS on Zeppelin, with Hive Metastore for metadata and schema management. Conducted transaction and retention analysis using Spark's structured APIs, delivering insights that improved marketing segmentation and targeting strategies."
